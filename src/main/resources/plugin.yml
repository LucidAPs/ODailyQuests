name: "ODailyQuests"
version: '${project.version}'
main: com.lucidaps.odailyquests.ODailyQuests
api-version: '26.2'
prefix: "O'DailyQuests"
authors: [ Ordwen, LucidAPs ]
description: Add more objectives and dynamize your server !
website: https://github.com/LucidAPs/ODailyQuests
softdepend: [ Vault, Citizens, PlaceholderAPI, PlayerPoints, HeadDatabase, Nexo, VotifierPlus, eco ]

libraries:
  - com.zaxxer:HikariCP:5.0.1
  - org.xerial:sqlite-jdbc:3.49.1.0
  - com.jeff-media:custom-block-data:2.2.5
  - com.h2database:h2:2.1.214
  - com.mysql:mysql-connector-j:9.4.0

commands:
  dquests:
    description: default player command
    aliases:
      - dailyquests
      - dq
      - quests
  dqadmin:
    description: admin command
    aliases:
      - dailyquestsadmin
      - dquestsadmin
      - dqa
      - qadmin

permissions:
  odailyquests.progress:
    description: "Allows the player to progress in ODailyQuests"
    default: true
  odailyquests.admin:
    description: "Allows the player to use the admin commands"
    default: op
  odailyquests.use:
    description: "Allows the player to use commands and see the player interface"
    default: op
  odailyquests.show:
    description: "Allows the player to see all category interfaces"
    default: op
  odailyquests.reroll:
    description: "Allows the player to reroll quests"
    default: op
